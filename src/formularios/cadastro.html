<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <script src="/src/theme.js"></script>
    <title>Cadastro | GreenEnergy</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@flaticon/flaticon-uicons@3.3.1/css/regular/rounded.css"
    />
    <link rel="stylesheet" href="/src/formularios/style.css" />
  </head>
  <body>
    <main>
      <a class="acesso-logo logo" href="/src/pages/home.html"
        ><span class="logo-marca" aria-hidden="true"><i class="fi fi-rr-sun"></i></span> GreenEnergy</a
      >
      <section class="painel" aria-labelledby="titulo-cadastro">
        <h1 id="titulo-cadastro">Criar conta</h1>
        <form class="form-grid" id="cadastro">
          <label for="nome">Nome completo</label>
          <input
            id="nome"
            name="nome"
            autocomplete="name"
            placeholder="Ex.: Maria da Silva"
            required
          />
          <label for="email">E-mail</label>
          <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            required
          />
          <label for="senha">Senha</label>
          <input
            id="senha"
            type="password"
            name="senha"
            minlength="6"
            autocomplete="new-password"
            aria-describedby="senha-ajuda"
            required
          />
          <small id="senha-ajuda">Use pelo menos 6 caracteres.</small>
          <label for="telefone">Telefone</label>
          <input id="telefone" type="tel" name="telefone" autocomplete="tel" />
          <label for="cpf">CPF</label>
          <input id="cpf" name="cpf" inputmode="numeric" />
          <label for="cep">CEP</label>
          <input
            id="cep"
            name="cep"
            autocomplete="postal-code"
            inputmode="numeric"
          />
          <label for="endereco">Endereço</label>
          <input
            id="endereco"
            name="endereco"
            autocomplete="street-address"
          />
          <label for="numero">Número</label>
          <input id="numero" name="numero" />
          <label for="bairro">Bairro</label>
          <input id="bairro" name="bairro" />
          <label for="cidade">Cidade</label>
          <input id="cidade" name="cidade" autocomplete="address-level2" />
          <label for="estado">Estado (UF)</label>
          <input
            id="estado"
            name="estado"
            maxlength="2"
            autocomplete="address-level1"
          />
          <div id="mensagem" role="status" aria-live="polite"></div>
          <button class="botao" type="submit">Cadastrar</button>
        </form>
      </section>
    </main>
    <footer class="creditos">
      Ícones por
      <a href="https://www.flaticon.com/uicons" target="_blank" rel="noopener noreferrer"
        >Flaticon UIcons</a
      >.
      <a href="/src/pages/home.html#creditos-imagens">Créditos de imagens</a>
    </footer>
    <script type="module" src="/src/formularios/cadastro.js"></script>
  </body>
</html>
